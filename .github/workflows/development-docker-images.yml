name: Create Development Docker Images

on:

  push:
    branches:
      - develop
      - 'main_v**'
      - 'feature_**'
      - 'bugfix_**'

  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - develop
      - 'main_v**'

  workflow_dispatch:
    inputs:
      github_name:
        description: 'Branch to build, e.g. develop'
        default: 'develop'
        required: true
        type: string
      push_image:
        description: 'Push images to Docker Hub'
        default: false
        type: boolean 

env:
  DOCKERHUB_BASE_REPO: dtcenter/met-base-dev
  DOCKERHUB_UNIT_TEST_REPO: dtcenter/met-base-unit-test-dev
  DOCKERHUB_METVIEWER_REPO: dtcenter/met-base-metviewer-dev

jobs:

  job_control:
    name: Set run options
    runs-on: ubuntu-latest

    steps:
      - name: Set run options 
        id: job_status 
        run: |
          if [[ ${{ github.event_name }} == 'workflow_dispatch' ]]; then
            github_name=${{ inputs.github_name }}
            push_image=${{ inputs.push_image }}
          else if [[ ${{ github.event_name }} == 'pull_request' ]]; then
            github_name="pull/${{ github.event.pull_request.number }}/merge"
            push_image='true'
          else
            github_name=${{ github.ref_name }}
            push_image='true'
          fi 
          echo "github_name=${github_name}" >> $GITHUB_OUTPUT
          echo "push_image=${push_image}" >> $GITHUB_OUTPUT

    outputs:
      github_name: ${{ steps.job_status.outputs.github_name }}
      push_image: ${{ steps.job_status.outputs.push_image }}

  build_scan_and_push:
    name: Build, Scan, and Push Images
    runs-on: ubuntu-latest
    needs: job_control

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.job_control.outputs.github_name }}
          path: ${{ needs.job_control.outputs.github_name }}

      - name: Create directories to store output
        run: |
          mkdir -p ${RUNNER_WORKSPACE}/logs

      - name: Build Docker Image
        run: |
          .github/jobs/build_docker_image.sh
        env:
          GITHUB_NAME: ${{ needs.job_control.outputs.github_name }}

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan Docker Image
        run: |
          .github/jobs/scan_docker_image.sh
        env:
          GITHUB_NAME: ${{ needs.job_control.outputs.github_name }}

      - name: Push Docker Image
        if: ${{ needs.job_control.outputs.push_image == 'true' }}
        run: |
          .github/jobs/push_docker_image.sh
        env:
          GITHUB_NAME: ${{ needs.job_control.outputs.github_name }}
          DOCKER_USERNAME: 'dtcenter'
          DOCKER_PASSWORD: ${{ secrets.DOCKER_TOKEN }}

      - name: Copy log files into logs directory
        if: always()
        run: |
          cp ${GITHUB_WORKSPACE}/*.log ${RUNNER_WORKSPACE}/logs/

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: ${{ runner.workspace }}/logs
          if-no-files-found: ignore

